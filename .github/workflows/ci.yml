name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Python tests (data checks skip without data)
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript engine vs Python reference values
        run: node web/test/run_node.js
